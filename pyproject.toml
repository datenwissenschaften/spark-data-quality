[project]
name = "spark-data-quality"
version = "0.1.0"
description = "Typed, Spark-native data-quality validation for PySpark DataFrames"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "datenwissenschaften", email = "martin.franke@datenwissenschaften.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pyspark>=4.0,<4.2",
]

[project.optional-dependencies]
# `packaging` is pinned explicitly as a safeguard: fugue's own dependency
# (`triad`) imports it without declaring it, so a bare environment that
# installs only this extra's declared requirements can otherwise fail with
# `ModuleNotFoundError: No module named 'packaging'` at import time.
fugue = ["fugue[spark]>=0.9.7,<0.10", "packaging>=23"]
notebook = [
    "jupyter>=1.1,<2",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "ipykernel>=6.29,<7",
    "plotly>=6.1,<7",
    "kaleido>=1.0,<2",
    "pandas>=2.2,<3",
]

[project.urls]
Repository = "https://github.com/datenwissenschaften/spark-data-quality"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10"
pytest-cov = ">=6,<8"
ruff = ">=0.9,<0.15"
mypy = ">=1.14,<2"
pandas-stubs = ">=2.2,<3"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fugue.*", "fugue_spark.*", "triad.*"]
ignore_missing_imports = true

# The `fugue` extra is optional, so CI type-checks this module both with it
# installed (locally, and in the `notebook` job) and without it (the
# `quality` job). Only the former surfaces the `attr-defined` errors that the
# ignores below suppress, so `warn_unused_ignores` would otherwise flag them
# as unused whenever `fugue` is absent.
[[tool.mypy.overrides]]
module = ["spark_data_quality.fugue"]
warn_unused_ignores = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: tests that execute against a local SparkSession",
]
